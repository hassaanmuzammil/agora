services:
  postgres:
    # Pinned — "latest" drifted to Postgres 18, which uses an incompatible
    # data directory layout vs. the existing volume (created under 17) and
    # refuses to start against it. Don't bump without migrating the data.
    image: postgres:17
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres's entrypoint auto-runs any *.sql here, but only the very
      # first time it initializes an empty data directory — it won't
      # retroactively apply to a volume that already has data.
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9090"

  qdrant:
    # Pinned to match qdrant-client==1.15.1 in backend/pyproject.toml —
    # "latest" drifts and Qdrant warns/breaks when client and server
    # minor versions diverge by more than one.
    image: qdrant/qdrant:v1.15.1
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    # Deliberately no QDRANT__SERVICE__API_KEY here: Qdrant enables auth
    # enforcement just from that env var being *set*, even to an empty
    # string — with QDRANT_API_KEY empty in .env that would 401 every
    # request, including from our own client. Only add this back once
    # QDRANT_API_KEY actually has a real value.
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    container_name: agora-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Constructed from the shared Postgres vars rather than passing
      # through .env's DATABASE_URL directly — that value is meant for
      # running the backend natively (targets localhost), while the
      # containerized backend needs the docker-network hostname instead.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: agora-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    external: true
    name: pro-rag_postgres_data
  minio_data:
    external: true
    name: pro-rag_minio_data
  qdrant_data:
    external: true
    name: pro-rag_qdrant_data
